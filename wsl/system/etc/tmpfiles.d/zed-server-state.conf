# Clear Zed's stale WSL remote-server state at boot.
#
# Zed's Windows app runs a remote server inside WSL and records its PID per workspace under
# ~/.local/share/zed/server_state/<identifier>/server.pid. That directory survives a WSL
# restart; PIDs do not — every boot restarts the PID namespace, so a recorded PID is
# meaningless. check_pid_file (crates/remote_server/src/server.rs, Zed 1.14.2) never accounts
# for that: it only checks that the PID exists, not that it belongs to a Zed server. So a
# survivor is either dead (harmless, Zed respawns), reused by the user (Zed SIGKILLs an
# unrelated process of theirs — silently) or reused by root (the kill fails and the proxy exits,
# leaving the Windows client stuck on "Starting proxy" forever).
#
# At boot there is by definition nothing valid here to protect, so clear it unconditionally —
# no liveness heuristic, and no way to race a running server. The `!` restricts this to boot;
# systemd-tmpfiles-setup.service runs with both --remove and --boot, and only at boot.
#
# The glob covers whichever account WSL logs in as, and matches nothing where Zed has never run.
# It targets the contents rather than server_state/ itself: Zed's ServerPaths::new does a
# create_dir_all for the per-workspace subdir either way, so this is the smaller blast radius.
#
# Coupled to Zed's on-disk layout (verified against 1.14.2): if Zed moves server_state/, this
# rule stops matching and the bug returns quietly.
R! /home/*/.local/share/zed/server_state/*
