[workspace]
name = "@PROJECT_NAME@"
channels = ["conda-forge"]
platforms = ["linux-64"]

# The default feature, folded into every environment below.
[dependencies]
python = "==3.14.6"

# Tasks available in every environment.
[tasks]
# serve = "python app.py"

# Isolated in the test feature so the prod environment can exclude them.
[feature.test.dependencies]
pytest = "==9.1.1"
basedpyright = "==1.39.8"
ruff = "==0.15.21"

# Present in default, which includes the test feature, and absent from prod.
[feature.test.tasks]
test = "pytest"
typecheck = "basedpyright"
lint = "ruff check"
fix = "ruff check --fix"
format = "ruff format"

# default carries the test tooling, for the editor and CI; prod carries the runtime alone, for
# a Docker image. The shared solve-group keeps python pinned identically across both.
[environments]
default = { features = ["test"], solve-group = "prod" }
prod = { solve-group = "prod" }
