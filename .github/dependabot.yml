version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      # "ci", not "deps": these actions run only in CI and never reach a provisioned
      # environment, so their bumps must not cut a release. release-please treats "ci" as a
      # hidden, non-releasable type, where the "deps" the shipped tools use cuts a patch.
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
