sonar.organization=tomborglum
sonar.projectKey=TomBorglum_wsl-cloud-init

# Sonar auto-detects the languages present, so no per-language configuration is needed.
sonar.sources=.

# The docs/ landing page layout is a Jekyll/Liquid template, not analyzable HTML: its
# <title> and metadata are injected by jekyll-seo-tag ({% seo %}) at build time, which
# Sonar's static HTML parser cannot see, so it misfires with "Add a <title> tag".
#
# .zed/ is editor config in JSONC, which Zed reads but Sonar's JSON parser cannot: the
# comments are parse errors to it.
sonar.exclusions=docs/_layouts/**,.zed/**
